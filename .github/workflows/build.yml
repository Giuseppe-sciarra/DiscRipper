name: Build & Release DiscRipper

# Ogni push su main (o avvio manuale) = build + test + release automatica.
# Versione: 1.0.<numero build>, tag v1.0.<numero build> creato dalla Action stessa.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Versione
        id: ver
        shell: pwsh
        run: |
          $v = "1.0.${{ github.run_number }}"
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
          Write-Host "Versione $v"

      - name: Test algoritmi (disc ID, AccurateRip, lettura sicura)
        run: dotnet run -c Release --project tests/DiscRipper.Tests/DiscRipper.Tests.csproj

      - name: Publish (self-contained, file singolo)
        run: >
          dotnet publish src/DiscRipper/DiscRipper.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version=${{ steps.ver.outputs.version }}
          -o out/DiscRipper

      - name: Scarica ffmpeg (gyan.dev essentials)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $exe = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName out/DiscRipper/ffmpeg.exe
          $lic = Get-ChildItem ffmpeg_tmp -Recurse -Filter LICENSE* | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName out/DiscRipper/ffmpeg-LICENSE.txt }
          & out/DiscRipper/ffmpeg.exe -hide_banner -encoders | Select-String "libmp3lame|libvorbis|libopus|flac|aac"

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path out/DiscRipper/* -DestinationPath DiscRipper-${{ steps.ver.outputs.version }}-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DiscRipper-${{ steps.ver.outputs.version }}-win-x64
          path: DiscRipper-*.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: DiscRipper ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            DiscRipper ${{ steps.ver.outputs.version }} — build automatica da `${{ github.sha }}`.

            **Installazione:** scompatta lo zip in una cartella e avvia `DiscRipper.exe` (ffmpeg.exe è già incluso, non serve installare .NET).

            Ultima modifica: ${{ github.event.head_commit.message }}
          files: DiscRipper-*.zip
