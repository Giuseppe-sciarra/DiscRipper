name: Build DiscRipper

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test algoritmi (disc ID, AccurateRip, lettura sicura)
        run: dotnet run -c Release --project tests/DiscRipper.Tests/DiscRipper.Tests.csproj

      - name: Versione
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') } else { $v = "1.0.0" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish (self-contained, file singolo)
        run: >
          dotnet publish src/DiscRipper/DiscRipper.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version=${{ steps.ver.outputs.version }}
          -o out/DiscRipper

      - name: Scarica ffmpeg (gyan.dev essentials)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $exe = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName out/DiscRipper/ffmpeg.exe
          $lic = Get-ChildItem ffmpeg_tmp -Recurse -Filter LICENSE* | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName out/DiscRipper/ffmpeg-LICENSE.txt }
          & out/DiscRipper/ffmpeg.exe -hide_banner -encoders | Select-String "libmp3lame|libvorbis|libopus|flac|aac"

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path out/DiscRipper/* -DestinationPath DiscRipper-${{ steps.ver.outputs.version }}-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DiscRipper-win-x64
          path: DiscRipper-*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DiscRipper-*.zip
